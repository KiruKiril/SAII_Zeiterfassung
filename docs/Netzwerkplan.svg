<rect x="110" y="837" width="26" height="16" fill="#FFE812"/>
<text x="144" y="850" font-size="11.5" fill="#141414">Anwendung / Dienst</text>
<rect x="286" y="837" width="26" height="16" fill="#141414"/>
<text x="320" y="850" font-size="11.5" fill="#141414">Infrastruktur / Datenhaltung</text>
<line x1="516" y1="845" x2="566" y2="845" stroke="#141414" stroke-width="2" marker-end="url(#ar)"/>
<text x="576" y="850" font-size="11.5" fill="#141414">Daten- oder Steuerverbindung</text>
<line x1="772" y1="845" x2="822" y2="845" stroke="#D92D20" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arR)"/>
