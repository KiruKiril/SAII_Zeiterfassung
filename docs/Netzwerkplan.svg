<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#141414"/></marker>
  <marker id="arR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#D92D20"/></marker>
</defs>
<rect width="1600" height="900" fill="#F2F1EC"/>

<!-- Titel -->
<rect x="82" y="58" width="536" height="52" fill="#FFE812"/>
<text x="92" y="98" font-size="38" font-weight="bold" font-style="italic" fill="#141414">Netzwerkplan Zeiterfassung</text>
<text x="92" y="140" font-size="15" fill="#444">Entwicklung &#8594; Git / CI / Registry &#8594; Kubernetes &#8594; Betrieb und Ueberwachung</text>

<!-- ===================== SPALTE 1: ENTWICKLUNG ===================== -->
<rect x="92" y="170" width="340" height="630" rx="10" fill="none" stroke="#141414" stroke-width="2" stroke-dasharray="9 6"/>
<text x="114" y="203" font-size="18" font-weight="bold" fill="#141414">Entwicklungsumgebung</text>
<text x="114" y="224" font-size="12.5" fill="#555">Laborneetz 192.168.110.0/24</text>

<rect x="114" y="244" width="296" height="300" rx="8" fill="#141414"/>
<text x="134" y="274" font-size="15" font-weight="bold" fill="#FFE812">LM &#183; 192.168.110.60</text>
<text x="134" y="294" font-size="11.5" fill="#D8D8D8">Ubuntu-VM &#183; Entwicklung und lokale Tests</text>

<rect x="134" y="308" width="256" height="218" rx="6" fill="none" stroke="#5A5A5A" stroke-width="1.5"/>
<text x="148" y="329" font-size="12" font-weight="bold" fill="#9A9A9A">Docker Engine &#183; minikube</text>
<text x="148" y="346" font-size="10.5" fill="#8A8A8A">Namespace ze-dev &#183; 1 Replica</text>

<rect x="150" y="356" width="224" height="60" rx="5" fill="#FFE812"/>
<text x="164" y="378" font-size="13" font-weight="bold" fill="#141414">Zeiterfassung</text>
<text x="164" y="396" font-size="11" fill="#3A3A2A">Flask + gunicorn &#183; Port 8080</text>
<text x="164" y="410" font-size="10" fill="#5A5A3A">/health &#183; /ready &#183; Rollen user / admin</text>

<rect x="150" y="426" width="224" height="52" rx="5" fill="#FFFFFF" stroke="#FFE812" stroke-width="1.5"/>
<text x="164" y="446" font-size="12" font-weight="bold" fill="#141414">PVC zeiterfassung-data</text>
<text x="164" y="463" font-size="10.5" fill="#444">/data/times.jsonl &#183; RWO 1 Gi</text>

<rect x="150" y="486" width="224" height="30" rx="5" fill="#2A2A2A"/>
<text x="164" y="506" font-size="11" fill="#D8D8D8">Service NodePort 30080 &#8594; 8080</text>

<rect x="114" y="566" width="296" height="134" rx="8" fill="#FFE812"/>
<text x="134" y="592" font-size="14" font-weight="bold" fill="#141414">Tests und Qualitaetssicherung</text>
<text x="134" y="614" font-size="11.5" fill="#3A3A2A">app/test_app.py &#183; 128 automatisierte Tests</text>
<text x="134" y="633" font-size="11.5" fill="#3A3A2A">Zustandsautomat &#183; CSRF &#183; RBAC &#183; XSS</text>
<text x="134" y="652" font-size="11.5" fill="#3A3A2A">Persistenz-Nachweis: Pod loeschen, Daten bleiben</text>
<text x="134" y="671" font-size="11.5" fill="#3A3A2A">kubectl kustomize &#183; dry-run gegen den Cluster</text>
<text x="134" y="690" font-size="10.5" fill="#6A6A4A">Image-Build als Non-Root, read-only rootfs</text>

<path d="M 262 566 L 262 544" fill="none" stroke="#D92D20" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arR)"/>
<text x="272" y="559" font-size="10.5" fill="#D92D20">Tests</text>

<!-- ===================== SPALTE 2: PLATTFORMDIENSTE ===================== -->
<rect x="462" y="170" width="380" height="330" rx="10" fill="none" stroke="#141414" stroke-width="2" stroke-dasharray="9 6"/>
<text x="484" y="203" font-size="18" font-weight="bold" fill="#141414">Zentrale Plattformdienste</text>
<text x="484" y="224" font-size="12.5" fill="#555">Git-Server &#183; CI &#183; Container Registry</text>

<rect x="484" y="248" width="168" height="78" rx="6" fill="#FFE812"/>
<text x="498" y="272" font-size="13.5" font-weight="bold" fill="#141414">Git Repository</text>
<text x="498" y="291" font-size="10.5" fill="#3A3A2A">app/ &#183; Dockerfile</text>
<text x="498" y="306" font-size="10.5" fill="#3A3A2A">k8s/base &#183; overlays</text>
<text x="498" y="320" font-size="10.5" fill="#3A3A2A">dev und prod</text>

<rect x="672" y="248" width="150" height="78" rx="6" fill="#FFE812"/>
<text x="686" y="272" font-size="13.5" font-weight="bold" fill="#141414">CI Pipeline</text>
<text x="686" y="291" font-size="10.5" fill="#3A3A2A">Build &#183; 128 Tests</text>
<text x="686" y="306" font-size="10.5" fill="#3A3A2A">Image bauen</text>
<text x="686" y="320" font-size="10.5" fill="#3A3A2A">Manifeste rendern</text>

<path d="M 652 287 L 668 287" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#ar)"/>

<rect x="540" y="372" width="250" height="78" rx="6" fill="#141414"/>
<text x="558" y="398" font-size="13.5" font-weight="bold" fill="#FFE812">Container Registry</text>
<text x="558" y="418" font-size="11" fill="#D8D8D8">registry.hfi.local/saii/zeiterfassung</text>
<text x="558" y="435" font-size="10.5" fill="#9A9A9A">versionierte Images &#183; Tag 1.0</text>

<path d="M 747 326 L 747 368" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#ar)"/>
<text x="755" y="352" font-size="10" fill="#444">Image Push</text>

<!-- Zugriff -->
<rect x="462" y="534" width="380" height="266" rx="10" fill="#141414"/>
<text x="484" y="566" font-size="16" font-weight="bold" fill="#FFE812">Zugriff und Rollen</text>

<text x="484" y="600" font-size="12" fill="#FFFFFF">Mitarbeitende &#8594; Stempeln</text>
<text x="760" y="600" font-size="11.5" fill="#D8D8D8">HTTPS 443</text>
<text x="484" y="624" font-size="10.5" fill="#9A9A9A">EIN &#183; PAUSE &#183; ZURUECK &#183; AUS, nur eigene Eintraege</text>

<text x="484" y="654" font-size="12" fill="#FFFFFF">Admin &#8594; Korrigieren und Nachtragen</text>
<text x="760" y="654" font-size="11.5" fill="#D8D8D8">HTTPS 443</text>
<text x="484" y="678" font-size="10.5" fill="#9A9A9A">Rolle admin &#183; Aenderungen werden protokolliert</text>

<text x="484" y="708" font-size="12" fill="#FFFFFF">Betrieb &#8594; kubectl und Logs</text>
<text x="760" y="708" font-size="11.5" fill="#D8D8D8">SSH 22</text>

<rect x="484" y="730" width="336" height="48" rx="5" fill="#FFE812"/>
<text x="498" y="750" font-size="11" fill="#141414">Daten nie direkt aus dem Internet erreichbar;</text>
<text x="498" y="767" font-size="11" fill="#141414">Zugang ausschliesslich ueber Service und Ingress.</text>

<!-- ===================== SPALTE 3: PRODUKTIV ===================== -->
<rect x="872" y="170" width="636" height="630" rx="10" fill="none" stroke="#141414" stroke-width="2" stroke-dasharray="9 6"/>
<text x="894" y="203" font-size="18" font-weight="bold" fill="#141414">Produktivumgebung &#183; Kubernetes</text>
<text x="894" y="224" font-size="12.5" fill="#555">Minikube-Node &#183; Namespaces getrennt &#183; IP gemaess Kundennetz</text>

<rect x="892" y="240" width="596" height="420" rx="8" fill="#FFFFFF" stroke="#141414" stroke-width="1.6"/>
<text x="910" y="265" font-size="14" font-weight="bold" fill="#141414">Kubernetes-Cluster</text>

<!-- ze-prod -->
<rect x="910" y="278" width="300" height="364" rx="7" fill="none" stroke="#141414" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="926" y="300" font-size="13" font-weight="bold" fill="#141414">Namespace zeiterfassung</text>
<text x="926" y="316" font-size="10.5" fill="#666">overlays/prod &#183; 3 Replicas</text>

<rect x="926" y="326" width="268" height="52" rx="5" fill="#FFE812"/>
<text x="940" y="346" font-size="12.5" font-weight="bold" fill="#141414">Ingress / Service</text>
<text x="940" y="364" font-size="10.5" fill="#3A3A2A">ClusterIP 80 &#8594; App-Port 8080</text>

<rect x="926" y="390" width="86" height="56" rx="5" fill="#FFE812"/>
<text x="938" y="410" font-size="11.5" font-weight="bold" fill="#141414">App Pod 1</text>
<text x="938" y="426" font-size="9.5" fill="#3A3A2A">gunicorn</text>
<text x="938" y="438" font-size="9.5" fill="#3A3A2A">UID 10001</text>

<rect x="1017" y="390" width="86" height="56" rx="5" fill="#FFE812"/>
<text x="1029" y="410" font-size="11.5" font-weight="bold" fill="#141414">App Pod 2</text>
<text x="1029" y="426" font-size="9.5" fill="#3A3A2A">gunicorn</text>
<text x="1029" y="438" font-size="9.5" fill="#3A3A2A">UID 10001</text>

<rect x="1108" y="390" width="86" height="56" rx="5" fill="#FFE812"/>
<text x="1120" y="410" font-size="11.5" font-weight="bold" fill="#141414">App Pod 3</text>
<text x="1120" y="426" font-size="9.5" fill="#3A3A2A">gunicorn</text>
<text x="1120" y="438" font-size="9.5" fill="#3A3A2A">UID 10001</text>

<path d="M 1060 378 L 1060 386" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#ar)"/>

<rect x="926" y="462" width="268" height="60" rx="5" fill="#FFFFFF" stroke="#FFE812" stroke-width="2"/>
<text x="940" y="482" font-size="12.5" font-weight="bold" fill="#141414">PVC + PersistentVolume</text>
<text x="940" y="500" font-size="10.5" fill="#444">/data/times.jsonl &#183; append-only</text>
<text x="940" y="515" font-size="10" fill="#666">ueberlebt Pod-Neustart &#183; RWO 1 Gi</text>

<path d="M 1060 446 L 1060 458" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#ar)"/>

<rect x="926" y="538" width="268" height="88" rx="5" fill="#141414"/>
<text x="940" y="560" font-size="12.5" font-weight="bold" fill="#FFE812">Absicherung im Cluster</text>
<text x="940" y="579" font-size="10.5" fill="#D8D8D8">NetworkPolicy: nur Ingress-Namespace</text>
<text x="940" y="595" font-size="10.5" fill="#D8D8D8">Secret: SECRET_KEY &#183; ZE_USERS</text>
<text x="940" y="611" font-size="10" fill="#9A9A9A">zur Laufzeit erzeugt, nicht im Image, nicht im Git</text>

<!-- platform -->
<rect x="1224" y="278" width="248" height="364" rx="7" fill="none" stroke="#777" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="1240" y="300" font-size="13" font-weight="bold" fill="#141414">Namespace platform</text>
<text x="1240" y="316" font-size="10.5" fill="#D92D20">Ausbaustufe &#183; nicht Teil der Abgabe</text>

<rect x="1240" y="326" width="216" height="64" rx="5" fill="#FFE812" opacity="0.55"/>
<text x="1254" y="347" font-size="12" font-weight="bold" fill="#141414">Health-Ueberwachung</text>
<text x="1254" y="364" font-size="10.5" fill="#3A3A2A">fragt /health und /ready ab</text>
<text x="1254" y="379" font-size="10" fill="#5A5A3A">bereits in der App vorhanden</text>

<rect x="1240" y="402" width="216" height="58" rx="5" fill="#FFE812" opacity="0.55"/>
<text x="1254" y="423" font-size="12" font-weight="bold" fill="#141414">Metriken und Dashboards</text>
<text x="1254" y="440" font-size="10.5" fill="#3A3A2A">Auslastung &#183; Antwortzeiten</text>
<text x="1254" y="454" font-size="10" fill="#5A5A3A">Replicas und Rollouts</text>

<rect x="1240" y="472" width="216" height="58" rx="5" fill="#2A2A2A" opacity="0.85"/>
<text x="1254" y="493" font-size="12" font-weight="bold" fill="#FFE812">Logsammlung</text>
<text x="1254" y="510" font-size="10.5" fill="#D8D8D8">gunicorn-Zugriffslog</text>
<text x="1254" y="524" font-size="10" fill="#9A9A9A">Kubernetes-Events</text>

<rect x="1240" y="542" width="216" height="84" rx="5" fill="#2A2A2A" opacity="0.85"/>
<text x="1254" y="563" font-size="12" font-weight="bold" fill="#FFE812">Alarmierung</text>
<text x="1254" y="581" font-size="10.5" fill="#D8D8D8">/ready meldet 503 &#8594; Pod faellt</text>
<text x="1254" y="596" font-size="10.5" fill="#D8D8D8">aus dem Service, kein Neustart</text>
<text x="1254" y="613" font-size="10" fill="#9A9A9A">Meldung an das Betriebsteam</text>

<path d="M 1194 418 L 1236 418" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#ar)"/>

<path d="M 1300 626 C 1300 672, 1150 664, 1120 690" fill="none" stroke="#D92D20" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arR)"/>

<!-- Betriebsmeldungen -->
<rect x="892" y="684" width="596" height="98" rx="8" fill="#FFFFFF" stroke="#141414" stroke-width="1.6"/>
<text x="912" y="710" font-size="14" font-weight="bold" fill="#141414">Betrieb und Nachvollziehbarkeit</text>
<text x="912" y="733" font-size="11" fill="#444">Jede Korrektur und jeder Nachtrag wird als eigener Datensatz angehaengt &#8211; nichts wird ueberschrieben.</text>
<text x="912" y="752" font-size="11" fill="#444">In der Admin-Ansicht steht, wer wann geaendert hat. Rollout mit strategy: Recreate wegen ReadWriteOnce.</text>
<text x="912" y="771" font-size="10.5" fill="#666">Dev und Prod unterscheiden sich nur in den Kustomize-Overlays: Replicas, Service-Typ, Image, Namespace.</text>

