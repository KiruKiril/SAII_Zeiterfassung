<text x="1010" y="841" font-size="10" fill="#666">Blass dargestellte Bausteine sind geplant und nicht Teil der Abgabe.</text>
<text x="1010" y="857" font-size="10" fill="#666">Ports und Adressen vor der Umsetzung mit dem Kundennetz abstimmen.</text>
